[project]
name = "plugrl-env-client"
version = "0.1.0"
description = "PlugRL environment client: runs Gymnasium environments and speaks the PlugRL wire protocol."
authors = [
    {name = "chenhao lu",email = "luch21@mails.tsinghua.edu.cn"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "loguru>=0.7.3,<0.8.0",
    "gymnasium>=1.2.0,<2.0.0",
    "dm-tree>=0.1.9,<0.2.0",
    "websockets>=15.0.1,<16.0.0",
    "msgpack>=1.1.1,<2.0.0",
    "tyro>=0.9.31,<0.10.0",
    "plugrl-protocol @ git+https://github.com/PlugRL/plugrl-protocol.git@a64ef63e6b74da7c579d59111559b0125346f702",
    "pandas>=2.3.3,<3.0.0",
    "imageio[ffmpeg]>=2.37.2,<3.0.0",
]

[project.scripts]
plugrl-run-env-client = "plugrl_env_client.cli:main"
plugrl-run-worker = "plugrl_env_client.cli:main"

[project.optional-dependencies]
robomimic = [
    "cython<3",
    "d4rl>=1.1,<2.0.0",
    "patchelf>=0.17.2.4,<0.18.0",
    "robomimic==0.3.0",
    "robosuite<1.5.0",
    "PyOpenGL==3.1.4",
]
atari = [
    "ale-py==0.9",
    "gymnasium[atari]>=1.2.1,<2.0.0",
]
classic = [
    "gymnasium[classic-control]>=1.2.1,<2.0.0",
]
mujoco = [
    "gymnasium[mujoco]>=1.2.1,<2.0.0",
]
d4rl = [
    "cython<3",
    "d4rl>=1.1,<2.0.0",
    "patchelf>=0.17.2.4,<0.18.0",
    "gymnasium-robotics[mujoco-py]>=1.4.1,<2.0.0",
]
libero = [
    "libero @ git+https://github.com/CTP314/LIBERO.git@f3bf9428c0d7113b0b72d1462d9552fca35fcf92",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13,<0.14.0",
    "pre-commit>=4.5.1,<5.0.0",
    "pytest>=9.0.2,<10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plugrl_env_client*"]

[tool.setuptools.package-data]
plugrl_env_client = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
extra-build-variables = { "egl-probe" = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" } }

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
