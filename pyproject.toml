[project]
name = "plugrl-env-client"
version = "0.1.0"
description = "PlugRL environment client: runs Gymnasium environments and speaks the PlugRL wire protocol."
authors = [
    {name = "chenhao lu",email = "luch21@mails.tsinghua.edu.cn"},
    {name = "Zuo Gou"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "loguru>=0.7.3,<0.8.0",
    "gymnasium>=1.2.0,<2.0.0",
    "dm-tree>=0.1.9,<0.2.0",
    "websockets>=15.0.1,<16.0.0",
    "msgpack>=1.1.1,<2.0.0",
    "tyro>=0.9.31,<0.10.0",
    "plugrl-protocol @ git+https://github.com/PlugRL/plugrl-protocol.git@840296ecbe39dddc6fb9f3ac92479decac0797bd",
    # The recorder's PNG snapshots. Its mp4 videos need ffmpeg: the `video`
    # extra.
    "imageio>=2.37.2,<3.0.0",
]

[project.scripts]
plugrl-run-env-client = "plugrl_env_client.cli:main"
plugrl-run-worker = "plugrl_env_client.cli:main"

[project.optional-dependencies]
# The recorder's videos (--recorder.record-video, --recorder.record-full-rollout).
# imageio-ffmpeg carries its own ffmpeg binary, 77 MB of an install that
# otherwise does not need it (E45).
video = [
    "imageio[ffmpeg]>=2.37.2,<3.0.0",
]
# robomimic 0.3.0, the last on PyPI, imports mujoco_py in env_robosuite, and
# mujoco_py needs MuJoCo 2.1 binaries and system GL headers; v0.4.0 does not,
# and supports robosuite 1.2 onwards. robosuite 1.4.1 with mujoco 2.3.7
# matches the environment metadata shipped in envs/robomimic/env_meta, and
# mujoco 3.x trips robosuite 1.4.1's joint-type assertion - so this extra and
# `mujoco` (gymnasium's MuJoCo 3) belong in separate environments. robomimic's
# dependency egl-probe builds with CMake: `pip install cmake` first.
robomimic = [
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0",
    "robosuite==1.4.1",
    "mujoco==2.3.7",
    "PyOpenGL==3.1.4",
]
atari = [
    "ale-py==0.9",
    "gymnasium[atari]>=1.2.1,<2.0.0",
]
classic = [
    "gymnasium[classic-control]>=1.2.1,<2.0.0",
]
mujoco = [
    "gymnasium[mujoco]>=1.2.1,<2.0.0",
]
d4rl = [
    "cython<3",
    "d4rl>=1.1,<2.0.0",
    "patchelf>=0.17.2.4,<0.18.0",
    "gymnasium-robotics[mujoco-py]>=1.4.1,<2.0.0",
]
# LIBERO runs on the same stack as robomimic: robosuite 1.4.1 with MuJoCo
# 2.3.7, as in the client environment E42 recorded. Unpinned, it resolved
# MuJoCo 3.6, which robosuite 1.4.1 rejects.
libero = [
    "libero @ git+https://github.com/CTP314/LIBERO.git@f3bf9428c0d7113b0b72d1462d9552fca35fcf92",
    "mujoco==2.3.7",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13,<0.14.0",
    "pre-commit>=4.5.1,<5.0.0",
    "pytest>=9.0.2,<10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plugrl_env_client*"]

[tool.setuptools.package-data]
plugrl_env_client = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
extra-build-variables = { "egl-probe" = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" } }
# robomimic and LIBERO need MuJoCo 2.3.7 and `mujoco` needs MuJoCo 3, so the
# lock resolves them separately instead of forcing one MuJoCo on all of them.
conflicts = [
    [{ extra = "robomimic" }, { extra = "mujoco" }],
    [{ extra = "libero" }, { extra = "mujoco" }],
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
