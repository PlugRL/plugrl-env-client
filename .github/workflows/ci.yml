name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pre-commit builds its hook environments with a system interpreter,
      # and .pre-commit-config pins default_language_version to python3.10.
      # setup-uv provides no system python, so without this the hooks fail
      # with "failed to find interpreter for python_spec='python3.10'".
      #
      # Note this disagrees with .python-version, which says 3.11. Worth
      # reconciling, but CI should install what the config asks for rather
      # than quietly pick a side.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--frozen` below installs from uv.lock without asking whether it still
      # matches pyproject.toml. It did not, for a while: robomimic moved to
      # 0.4.0 and the lock kept 0.3.0. This fails when the two disagree.
      - name: Lock is current
        run: uv lock --check

      # No extras: the point of this package is that it installs without a
      # deep learning stack, and the test suite asserts exactly that.
      - name: Sync
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      # plugrl-protocol's probe checker, with this client running the probe
      # environment (SPEC.md section 8.1). It works out from each feedback
      # what the client did with each action, and drives every scenario:
      # basic, a resync, a text frame. Once as a version 1 server, once
      # offering reuse-feedback-obs (10.1), which this client then uses.
      - name: Probe this client against SPEC.md
        run: |
          client=".venv/bin/plugrl-run-env-client probe-v1 --server-host 127.0.0.1 --server-port 8000 --num-envs 3 --num-episodes 1000000"
          for features in "" "--features reuse-feedback-obs"; do
            echo "::group::plugrl-conformance --probe ${features:-(no features)}"
            uv run plugrl-conformance --probe --scenario all --port 8000 \
              --steps 12 --horizon 4 --action-dim 3 --action-dtype float64 \
              --timeout 60 $features --client "$client"
            echo "::endgroup::"
          done
